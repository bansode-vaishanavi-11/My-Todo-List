<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7952c7">
<title>My Tasks | Smart Student Planner</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f7f5ff;
 color:#30284b;
}
header{
 background:linear-gradient(135deg,#7952c7,#a58be5);
 color:white;
 padding:25px 15px;
 text-align:center;
 border-radius:0 0 25px 25px;
}
header h1{margin:8px}
.container{max-width:720px;margin:auto;padding:16px}
.card{
 background:white;
 border-radius:17px;
 padding:18px;
 margin-bottom:17px;
 box-shadow:0 3px 12px #e5e0ef;
}
input:not([type=checkbox]),select{
 width:100%;
 padding:12px;
 margin:7px 0 14px;
 border:1px solid #ccc;
 border-radius:9px;
 font-size:16px;
}
label{font-weight:bold;font-size:14px}
button,.back{
 display:inline-block;
 padding:11px 15px;
 background:#7952c7;
 color:white;
 border:0;
 border-radius:10px;
 cursor:pointer;
 text-decoration:none;
 font-size:14px;
}
button:disabled{opacity:.55}
.full{width:100%;margin-top:8px}
.green{background:#23845c}
.red{background:#cf4961}
.orange{background:#bd722b}
.blue{background:#376bbd}
.task{
 padding:14px;
 margin:11px 0;
 background:#f7f5ff;
 border-radius:12px;
 overflow-wrap:anywhere;
}
.task.done{opacity:.65}
.task.done .taskName{text-decoration:line-through}
.taskName{font-weight:bold;font-size:17px}
.small{color:#666;font-size:13px;line-height:1.5}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.actions button{font-size:13px;padding:9px}
#alarmPopup{
 display:none;
 position:fixed;
 inset:0;
 z-index:9999;
 background:#241b3d;
 color:white;
 padding:22px;
 align-items:center;
 justify-content:center;
 text-align:center;
}
.alarmContent{width:100%;max-width:420px}
.alarmBell{font-size:75px;animation:ring 1s infinite}
@keyframes ring{
 0%,100%{transform:rotate(0)}
 25%{transform:rotate(15deg)}
 75%{transform:rotate(-15deg)}
}
.alarmContent h1{font-size:31px}
.alarmContent h2{overflow-wrap:anywhere}
.alarmContent button{
 display:block;
 width:100%;
 margin:13px 0;
 padding:16px;
 font-size:17px;
}
.soundStatus{font-size:13px;color:#666}
</style>
</head>

<body>

<header>
 <div style="font-size:42px">✅</div>
 <h1 id="pageTitle">My Tasks</h1>
 <p>Plan • Complete • Achieve</p>
 <a class="back" href="index.html">← Dashboard</a>
 <button id="langButton" onclick="switchLanguage()">मराठी</button>
</header>

<main class="container">

<section class="card">
 <h3 id="helpTitle">📖 How to Use</h3>
 <p id="helpText">
 Add your task, choose date and time, enable alarm and save.
 </p>

 <button class="full green" onclick="enableSound()" id="soundButton">
 🔊 Enable Alarm Sound
 </button>
 <p id="soundStatus" class="soundStatus">
 Tap this button once to enable and test sound.
 </p>
</section>

<section class="card">
 <h2 id="formTitle">➕ Add New Task</h2>

 <form id="taskForm">

  <label id="nameLabel" for="taskName">Task Name</label>
  <input id="taskName" required maxlength="120"
   placeholder="Enter Task Name">

  <label id="dateLabel" for="taskDate">Date</label>
  <input id="taskDate" type="date" required>

  <label id="timeLabel" for="taskTime">Time</label>
  <input id="taskTime" type="time" required>

  <label id="priorityLabel" for="priority">Priority</label>
  <select id="priority">
   <option value="High">High</option>
   <option value="Medium" selected>Medium</option>
   <option value="Low">Low</option>
  </select>

  <label>
   <input id="enableAlarm" type="checkbox" checked>
   <span id="alarmLabel">Enable Alarm 🔔</span>
  </label>

  <button type="submit" class="full" id="saveButton">
   Save Task
  </button>

  <button type="button" class="full orange"
   id="cancelButton" style="display:none"
   onclick="cancelEdit()">
   Cancel Edit
  </button>

 </form>
</section>

<section class="card">
 <h2 id="listTitle">📋 My Task List</h2>
 <div id="taskList"></div>
</section>

</main>

<!-- FULL SCREEN ALARM -->

<div id="alarmPopup" role="alertdialog"
 aria-modal="true" aria-labelledby="alarmHeading">

 <div class="alarmContent">
  <div class="alarmBell">🔔</div>

  <h1 id="alarmHeading">TASK ALARM!</h1>
  <p>Smart Student Planner</p>

  <hr style="border-color:#68567f">

  <h2 id="alarmTaskName"></h2>
  <p id="alarmTime"></p>

  <button class="blue" onclick="snoozeAlarm()" id="snoozeButton">
   Snooze 5 Minutes
  </button>

  <button class="red" onclick="dismissAlarm()" id="dismissButton">
   Dismiss Alarm
  </button>
 </div>
</div>

<script>
"use strict";

const KEY="tasks";
let tasks=[];
let editingIndex=null;
let activeAlarm=null;
let alarmQueue=[];
let audioContext=null;
let soundEnabled=false;
let soundInterval=null;
let language=localStorage.getItem("plannerLanguage")||"en";

function el(id){
 return document.getElementById(id);
}

function loadTasks(){
 try{
  const data=JSON.parse(localStorage.getItem(KEY)||"[]");
  if(!Array.isArray(data))throw Error("Invalid task data");
  tasks=data;
 }catch(e){
  alert("Could not read saved tasks. Existing data has not been overwritten.");
  return false;
 }
 return true;
}

function saveTasks(){
 localStorage.setItem(KEY,JSON.stringify(tasks));
}

function todayDate(){
 const d=new Date();
 return d.getFullYear()+"-"+
 String(d.getMonth()+1).padStart(2,"0")+"-"+
 String(d.getDate()).padStart(2,"0");
}

function playBeep(){
 if(!audioContext||audioContext.state!=="running")return;

 try{
  const start=audioContext.currentTime;

  for(let i=0;i<3;i++){
   const osc=audioContext.createOscillator();
   const gain=audioContext.createGain();

   osc.type="sine";
   osc.frequency.value=850;

   gain.gain.setValueAtTime(0.0001,start+i*.35);
   gain.gain.exponentialRampToValueAtTime(
    0.16,start+i*.35+.02
   );
   gain.gain.exponentialRampToValueAtTime(
    0.0001,start+i*.35+.25
   );

   osc.connect(gain);
   gain.connect(audioContext.destination);

   osc.start(start+i*.35);
   osc.stop(start+i*.35+.27);
  }
 }catch(e){
  console.log("Sound error",e);
 }
}

async function enableSound(){
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;

  if(!AudioCtx){
   el("soundStatus").textContent="Audio is not supported.";
   return;
  }

  if(!audioContext)audioContext=new AudioCtx();

  await audioContext.resume();

  soundEnabled=audioContext.state==="running";

  if(soundEnabled){
   el("soundStatus").textContent=
    "✅ Sound enabled. Did you hear the test beep?";
   playBeep();
  }else{
   el("soundStatus").textContent=
    "Audio is blocked. Tap Enable Alarm Sound again.";
  }
 }catch(e){
  el("soundStatus").textContent=
   "Could not start sound. Check iPad volume and browser settings.";
 }
}

// Try to unlock audio on user interaction.
document.addEventListener("pointerdown",function(){
 if(audioContext && audioContext.state==="suspended"){
  audioContext.resume().catch(()=>{});
 }
});

function stopAlarmSound(){
 if(soundInterval){
  clearInterval(soundInterval);
  soundInterval=null;
 }
}

function startAlarmSound(){
 stopAlarmSound();

 if(!soundEnabled)return;

 if(audioContext && audioContext.state==="suspended"){
  audioContext.resume().catch(()=>{});
 }

 playBeep();

 soundInterval=setInterval(()=>{
  if(activeAlarm)playBeep();
  else stopAlarmSound();
 },1800);
}

function renderTasks(){
 const list=el("taskList");
 list.replaceChildren();

 if(!tasks.length){
  const p=document.createElement("p");
  p.textContent=language==="mr"?
   "अजून कोणतेही काम नाही.":"No tasks added yet.";
  list.appendChild(p);
  return;
 }

 tasks.forEach((t,i)=>{
  const item=document.createElement("div");
  item.className="task"+(t.done?" done":"");

  const name=document.createElement("div");
  name.className="taskName";
  name.textContent=t.text||"Untitled Task";

  const info=document.createElement("p");
  info.className="small";
  info.textContent=
   (t.date||"No date")+" • "+(t.time||"No time")+
   " • "+(t.priority||"Medium")+
   " • "+(t.done?"Completed":t.alarm?"🔔 Alarm ON":"Alarm OFF");

  const actions=document.createElement("div");
  actions.className="actions";

  actions.appendChild(makeButton(
   t.done?"↩️ Undo":"✓ Complete","green",()=>{
    t.done=!t.done;

    if(t.done){
     t.notified=true;
     t.snoozeUntil=null;
     alarmQueue=alarmQueue.filter(x=>x!==t);

     if(activeAlarm===t)dismissAlarm();
    }

    saveTasks();
    renderTasks();
   }
  ));

  actions.appendChild(makeButton("✏️ Edit","blue",()=>{
   editingIndex=i;

   el("taskName").value=t.text||"";
   el("taskDate").value=t.date||todayDate();
   el("taskTime").value=t.time||"";
   el("priority").value=t.priority||"Medium";
   el("enableAlarm").checked=!!t.alarm;

   el("formTitle").textContent="✏️ Edit Task";
   el("saveButton").textContent="Update Task";
   el("cancelButton").style.display="block";

   window.scrollTo({top:0,behavior:"smooth"});
  }));

  actions.appendChild(makeButton("🗑️ Delete","red",()=>{
   if(!confirm("Delete this task?"))return;

   alarmQueue=alarmQueue.filter(x=>x!==t);

   if(activeAlarm===t){
    stopAlarmSound();
    activeAlarm=null;
    el("alarmPopup").style.display="none";
   }

   tasks.splice(i,1);
   saveTasks();
   renderTasks();
   showNextAlarm();
  }));

  item.append(name,info,actions);
  list.appendChild(item);
 });
}

function makeButton(label,cls,fn){
 const b=document.createElement("button");
 b.textContent=label;
 b.className=cls;
 b.type="button";
 b.addEventListener("click",fn);
 return b;
}

el("taskForm").addEventListener("submit",e=>{
 e.preventDefault();

 const name=el("taskName").value.trim();
 const date=el("taskDate").value;
 const time=el("taskTime").value;

 if(!name||!date||!time)return;

 const old=editingIndex===null?null:tasks[editingIndex];

 const task={
  ...(old||{}),
  text:name,
  date,
  time,
  priority:el("priority").value,
  alarm:el("enableAlarm").checked,
  done:old?!!old.done:false,
  notified:false,
  snoozeUntil:null
 };

 if(old){
  alarmQueue=alarmQueue.filter(x=>x!==old);

  if(activeAlarm===old){
   stopAlarmSound();
   activeAlarm=null;
   el("alarmPopup").style.display="none";
  }

  tasks[editingIndex]=task;
 }else{
  tasks.push(task);
 }

 saveTasks();
 cancelEdit();
 renderTasks();
 checkAlarms();
});

function cancelEdit(){
 editingIndex=null;
 el("taskForm").reset();
 el("taskDate").value=todayDate();
 el("priority").value="Medium";
 el("enableAlarm").checked=true;
 el("formTitle").textContent="➕ Add New Task";
 el("saveButton").textContent="Save Task";
 el("cancelButton").style.display="none";
}

function checkAlarms(){
 const now=Date.now();

 for(const t of tasks){
  if(!t.alarm||t.done||t.notified||!t.date||!t.time)continue;

  const due=new Date(t.date+"T"+t.time).getTime();
  const target=t.snoozeUntil||due;

  if(!Number.isFinite(target))continue;

  // Ignore old missed alarms after one minute.
  if(!t.snoozeUntil && now-due>60000)continue;

  if(now>=target && !alarmQueue.includes(t) && activeAlarm!==t){
   alarmQueue.push(t);
  }
 }

 showNextAlarm();
}

function showNextAlarm(){
 if(activeAlarm)return;

 while(alarmQueue.length){
  const next=alarmQueue.shift();

  if(!tasks.includes(next)||next.done||!next.alarm||next.notified){
   continue;
  }

  activeAlarm=next;

  el("alarmTaskName").textContent=next.text||"Task Reminder";
  el("alarmTime").textContent=
   (next.date||"")+" • "+(next.time||"");

  el("alarmPopup").style.display="flex";
  startAlarmSound();
  return;
 }
}

function closeAlarm(){
 stopAlarmSound();
 el("alarmPopup").style.display="none";
 activeAlarm=null;
 saveTasks();
 renderTasks();
 showNextAlarm();
}

function snoozeAlarm(){
 if(!activeAlarm)return;

 activeAlarm.snoozeUntil=Date.now()+5*60*1000;
 activeAlarm.notified=false;
 closeAlarm();
}

function dismissAlarm(){
 if(!activeAlarm)return;

 activeAlarm.notified=true;
 activeAlarm.snoozeUntil=null;
 closeAlarm();
}

function switchLanguage(){
 language=language==="en"?"mr":"en";
 localStorage.setItem("plannerLanguage",language);
 updateLanguage();
}

function updateLanguage(){
 const mr=language==="mr";
 document.documentElement.lang=language;

 const words={
  pageTitle:["My Tasks","माझी कामे"],
  langButton:["मराठी","English"],
  helpTitle:["📖 How to Use","📖 कसे वापरावे"],
  helpText:[
   "Add your task, choose date and time, enable alarm and save.",
   "कामाचे नाव, तारीख आणि वेळ निवडा. अलार्म सुरू करून सेव्ह करा."
  ],
  soundButton:["🔊 Enable Alarm Sound","🔊 अलार्मचा आवाज सुरू करा"],
  nameLabel:["Task Name","कामाचे नाव"],
  dateLabel:["Date","तारीख"],
  timeLabel:["Time","वेळ"],
  priorityLabel:["Priority","प्राधान्य"],
  alarmLabel:["Enable Alarm 🔔","अलार्म सुरू करा 🔔"],
  listTitle:["📋 My Task List","📋 माझ्या कामांची यादी"],
  alarmHeading:["TASK ALARM!","कामाचा अलार्म!"],
  snoozeButton:["Snooze 5 Minutes","5 मिनिटांनी पुन्हा"],
  dismissButton:["Dismiss Alarm","अलार्म बंद करा"]
 };

 for(const id in words){
  el(id).textContent=words[id][mr?1:0];
 }

 if(editingIndex===null){
  el("formTitle").textContent=mr?"➕ नवीन काम":"➕ Add New Task";
  el("saveButton").textContent=mr?"काम सेव्ह करा":"Save Task";
 }

 renderTasks();
}

if(loadTasks()){
 el("taskDate").value=todayDate();
 updateLanguage();

 setInterval(checkAlarms,1000);
 checkAlarms();

 document.addEventListener("visibilitychange",()=>{
  if(!document.hidden)checkAlarms();
 });
}
</script>

</body>
</html>
